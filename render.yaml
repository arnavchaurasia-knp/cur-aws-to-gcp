services:
  - type: web
    name: cur-web
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: WEB_ROOT
        value: /app/frontend/dist
      - key: DATA_DIR
        value: /data
      - key: SKILL_DIR
        value: /app/skill/aws-gcp-cost-projection
      - key: DEV_AUTH_BYPASS
        value: "false"
      - key: BUILD_SHA
        value: ${RENDER_GIT_COMMIT}
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: "https://cur-web-br12.onrender.com/login"
      # Session cookie AES key. NEVER give this a literal value here:
      # render.yaml is committed to a public repo, so a value: would publish
      # the key and let anyone forge a session for any user. Set it in the
      # Render dashboard to a base64-encoded 32-byte random value
      # (openssl rand -base64 32).
      - key: SESSION_SECRET
        sync: false
      - key: APP_BASE_URL
        value: "https://cur-web-br12.onrender.com"
      # 100% Free Persistent Database (Turso libSQL / SQLite Cloud - 9 GB free forever)
      # Create free at https://turso.tech/ -> libsql://[dbname]-[org].turso.io?authToken=[token]
      - key: DATABASE_URL
        sync: false
      # 100% Free Persistent Artifact Storage (Cloudflare R2 - 10 GB free forever, $0 egress fees)
      # Create free at https://dash.cloudflare.com/ -> R2 -> Create bucket
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: "auto"
      # Antigravity (AGY) API Key for LLM classification & sizing
      - key: ANTIGRAVITY_API_KEY
        sync: false
      - key: AGY_API_KEY
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        value: "346097607523"
      - key: GOOGLE_CLOUD_AVAILABILITY_PROJECT
        value: "346097607523"

